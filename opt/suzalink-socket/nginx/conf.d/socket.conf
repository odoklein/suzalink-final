# ─────────────────────────────────────────────
# Nginx config for suzalink-socket (WSS + HTTP)
# Domain: socket.suzalink.cloud
# ─────────────────────────────────────────────

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=socket_limit:10m rate=30r/s;

# Upstream
upstream socket_backend {
    server suzalink-socket:4000;
    keepalive 64;
}

# ── HTTP → HTTPS redirect + ACME challenge ──
server {
    listen 80;
    server_name socket.suzalink.cloud;

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS with WSS support ──
server {
    listen 443 ssl http2;
    server_name socket.suzalink.cloud;

    # SSL certificates (managed by certbot)
    ssl_certificate     /etc/letsencrypt/live/socket.suzalink.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/socket.suzalink.cloud/privkey.pem;

    # Modern SSL config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limiting
    limit_req zone=socket_limit burst=50 nodelay;

    # ── Socket.IO WebSocket endpoint ──
    location /socket.io/ {
        proxy_pass http://socket_backend;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preserve client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-lived connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for real-time
        proxy_buffering off;
        proxy_cache off;
    }

    # ── REST API endpoints (health, broadcast) ──
    location / {
        proxy_pass http://socket_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Standard timeouts
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
